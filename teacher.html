<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة المعلمين - مدرسة الطيبة الثانوية الشاملة للبنين</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            direction: rtl;
            text-align: right;
        }
        .container {
            max-width: 800px;
            margin: 30px auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h2 {
            color: #1a365d;
            text-align: center;
            margin-bottom: 25px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #2d3748;
        }
        select, input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e0;
            border-radius: 6px;
            font-size: 16px;
            box-sizing: border-box;
        }
        button {
            background-color: #3182ce;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #2b6cb0;
        }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #718096;
            text-decoration: none;
        }
        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>بوابة المعلمين - سجل الغياب اليومي</h2>
        
        <div class="form-group">
            <label for="teacherName">اسم المعلم:</label>
            <input type="text" id="teacherName" placeholder="أدخل اسمك الكريم">
        </div>

        <div class="form-group">
            <label for="classSelect">اختر الصف:</label>
            <select id="classSelect">
                <option value="">-- اختر الصف الدراسي --</option>
                <option value="الاول الثانوي">العاشر الأساسي</option>
                <option value="الثاني الثانوي">الأول الثانوي</option>
                <option value="التوجيهي">التوجيهي</option>
            </select>
        </div>

        <button onclick="startAttendance()">بدء تسجيل الغياب</button>

        <a href="index.html" class="back-link">العودة إلى الرئيسية</a>
    </div>

    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwwxK-Q4hcs44F9bRLYvHC4-Itfxg8E-47ibsOySBj_mGnYIZNBG0dWsXnTr-QBdUXGw/exec";

        function startAttendance() {
            const teacher = document.getElementById('teacherName').value;
            const schoolClass = document.getElementById('classSelect').value;
            
            if(!teacher || !schoolClass) {
                alert("الرجاء إدخال اسم المعلم واختيار الصف!");
                return;
            }
            
            alert("مرحباً أ. " + teacher + "، سيتم الانتقال للوحة صف " + schoolClass);
        }
    </script>

</body>
</html>
