<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مدرسة الطيبة الثانوية الشاملة للبنين</title>
    <style>
        body {
            font-family: Tahoma, Arial, sans-serif;
            background-color: #0b132b;
            color: #ffffff;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        .card-box {
            border: 2px solid #3b82f6;
            background-color: rgba(59, 130, 246, 0.05);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
        }
        .card-box h4 {
            margin-top: 0;
            color: #60a5fa;
            font-size: 20px;
        }
        .card-box p {
            color: #d1d5db;
            line-height: 1.6;
        }
        .initiative-btn {
            display: inline-block;
            background-color: #2563eb;
            color: #ffffff;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 15px;
            text-decoration: none;
            box-shadow: 0 4px 12px rgba(37,99,235,0.3);
            transition: background-color 0.3s;
        }
        .initiative-btn:hover {
            background-color: #1d4ed8;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- بطاقة مبادرة "لمدرستي أنتمي" كرابط تشعبي مباشر ومضمون -->
        <div class="card-box">
            <h4>🌱 مبادرة "لمدرستي أنتمي"</h4>
            <p>تعزيز قيم الانتماء والولاء للمؤسسة التعليمية، وتفعيل المشاركة الطلابية الفعالة في العناية بمرافق المدرسة والحفاظ على بيئتها النموذجية.</p>
            <div style="margin-top: 15px;">
                <a href="https://drive.google.com/file/d/1BZ4DzEsi0W5Dh8asdUxsPg7V31yCfRpe/view?usp=sharing" target="_blank" class="initiative-btn">
                    🔗 انقر هنا للانتقال إلى صفحة المبادرة مباشرة
                </a>
            </div>
        </div>
    </div>

</body>
</html>
