<!-- استبدل بطاقة مبادرة "لمدرستي أنتمي" القديمة بهذا الكود الجديد -->
<div class="card-box">
    <h4>🌱 مبادرة "لمدرستي أنتمي"</h4>
    <p>تعزيز قيم الانتماء والولاء للمؤسسة التعليمية، وتفعيل المشاركة الطلابية الفعالة في العناية بمرافق المدرسة والحفاظ على بيئتها النموذجية.</p>
    
    <!-- هذا هو زر تصفح المبادرة الذي كان مفقوداً -->
    <button class="btn-initiative" onclick="openInitiativeModal()">📖 تصفح وثيقة المبادرة</button>
</div>

<!-- يجب وضع هذا الكود في نهاية ملف HTML، قبل وسم </body> -->
<div id="initiativeModal" class="modal-overlay" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background-color:rgba(11, 19, 43, 0.9); z-index:1000; justify-content:center; align-items:center; padding:20px; box-sizing:border-box;">
    <div class="modal-content" style="background-color:#1c2541; border:1px solid #3a506b; border-radius:12px; width:100%; max-width:900px; height:85vh; display:flex; flex-direction:column; overflow:hidden; box-shadow:0 15px 35px rgba(0,0,0,0.5);">
        <div class="modal-header" style="background-color:#0b132b; padding:15px 25px; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #3a506b;">
            <h3 style="margin:0; color:#ffffff; font-size:18px;">وثيقة مبادرة "لمدرستي أنتمي"</h3>
            <button class="btn-close-modal" onclick="closeInitiativeModal()" style="background-color:#ef4444; color:white; border:none; padding:8px 16px; border-radius:6px; cursor:pointer; font-weight:bold; font-size:14px;">رجوع للصفحة الرئيسية ✕</button>
        </div>
        <div class="modal-body" style="flex:1; padding:0; position:relative; background:#ffffff;" oncontextmenu="return false;">
            <!-- رابط المستند الخاص بك بصيغة العرض المحمي -->
            <iframe id="initiativeFrame" src="https://drive.google.com/file/d/1BZ4DzEsi0W5Dh8asdUxsPg7V31yCfRpe/preview" style="width:100%; height:100%; border:none;" allow="autoplay"></iframe>
        </div>
    </div>
</div>

<script>
    function openInitiativeModal() {
        const modal = document.getElementById('initiativeModal');
        modal.style.display = 'flex';
    }

    function closeInitiativeModal() {
        const modal = document.getElementById('initiativeModal');
        modal.style.display = 'none';
    }

    // منع النقر بزر الماوس الأيمن داخل النافذة المنبثقة للحماية
    document.getElementById('initiativeModal').addEventListener('contextmenu', function(e) {
        e.preventDefault();
    });
</script>

<!-- إضافة تنسيق بسيط للزر في حال لم يكن موجوداً في ملف الـ CSS الخاص بك -->
<style>
    .btn-initiative {
        display: inline-block;
        background-color: #2563eb;
        color: #ffffff;
        padding: 8px 16px;
        border-radius: 6px;
        text-decoration: none;
        font-size: 13px;
        margin-top: 15px;
        font-weight: bold;
        transition: background 0.2s;
        border: none;
        cursor: pointer;
    }
    .btn-initiative:hover {
        background-color: #1d4ed8;
    }
</style>
