<!-- بطاقة مبادرة "لمدرستي أنتمي" -->
<div class="card-box" onclick="openInitiativeModal()" style="cursor: pointer; border: 2px solid #3b82f6; background-color: rgba(59, 130, 246, 0.05); transition: 0.3s;">
    <h4>🌱 مبادرة "لمدرستي أنتمي"</h4>
    <p>تعزيز قيم الانتماء والولاء للمؤسسة التعليمية، وتفعيل المشاركة الطلابية الفعالة في العناية بمرافق المدرسة والحفاظ على بيئتها النموذجية.</p>
    <div style="margin-top: 12px;">
        <span style="color: #60a5fa; font-weight: bold; font-size: 14px; text-decoration: underline;">🔗 انقر هنا لتصفح وثيقة المبادرة مباشرة</span>
    </div>
</div>

<!-- النافذة المنبثقة لعرض المستند -->
<div id="initiativeModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(11, 19, 43, 0.95); z-index: 9999; justify-content: center; align-items: center; padding: 15px; box-sizing: border-box;">
    <div style="background-color: #1c2541; border: 1px solid #3a506b; border-radius: 12px; width: 100%; max-width: 950px; height: 90vh; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 15px 35px rgba(0,0,0,0.6);">
        <div style="background-color: #0b132b; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #3a506b;">
            <h3 style="margin: 0; color: #ffffff; font-size: 16px;">وثيقة مبادرة "لمدرستي أنتمي"</h3>
            <button onclick="closeInitiativeModal()" style="background-color: #ef4444; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 14px;">رجوع للصفحة الرئيسية ✕</button>
        </div>
        <div style="flex: 1; padding: 0; position: relative; background: #ffffff;" oncontextmenu="return false;">
            <iframe src="https://drive.google.com/file/d/1BZ4DzEsi0W5Dh8asdUxsPg7V31yCfRpe/preview" style="width: 100%; height: 100%; border: none;" allow="autoplay"></iframe>
        </div>
    </div>
</div>

<script>
    function openInitiativeModal() {
        const modal = document.getElementById('initiativeModal');
        if (modal) {
            modal.style.setProperty('display', 'flex', 'important');
        }
    }

    function closeInitiativeModal() {
        const modal = document.getElementById('initiativeModal');
        if (modal) {
            modal.style.setProperty('display', 'none', 'important');
        }
    }

    // منع النقر بزر الماوس الأيمن لحماية الملف داخل النافذة
    document.addEventListener('DOMContentLoaded', function() {
        const modal = document.getElementById('initiativeModal');
        if (modal) {
            modal.addEventListener('contextmenu', function(e) {
                e.preventDefault();
            });
        }
    });
</script>
