<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة الحضور والغياب - مدرسة الطيبة الثانوية الشاملة للبنين</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            direction: rtl;
            text-align: right;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h2 {
            color: #1a365d;
            text-align: center;
            margin-bottom: 25px;
        }
        .portal-box {
            background: #1a365d;
            color: white;
            padding: 25px;
            border-radius: 10px;
            text-align: center;
            margin-bottom: 20px;
        }
        .portal-box h3 {
            margin-top: 0;
        }
        .btn {
            display: inline-block;
            background-color: #3182ce;
            color: white;
            padding: 12px 30px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            margin-top: 15px;
            transition: background 0.2s;
        }
        .btn:hover {
            background-color: #2b6cb0;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>مدرسة الطيبة الثانوية الشاملة للبنين</h2>
        <p style="text-align: center; color: #4a5568;">البوابة الإلكترونية لإدارة الحضور والغياب ورصد السجلات</p>

        <!-- بوابة المعلمين -->
        <div class="portal-box">
            <h3>بوابة المعلمين</h3>
            <p>مخصصة لمربي الصفوف للتحضير ورصد حالات الحضور والغياب اليومية.</p>
            <a href="teacher.html" class="btn">دخول المعلمين</a>
        </div>

    </div>

</body>
</html>
